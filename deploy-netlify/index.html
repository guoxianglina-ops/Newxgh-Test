<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能仓库管理系统 V2</title>
<style>
:root{
  --pri:#1890ff;--pri-d:#096dd9;--suc:#52c41a;--war:#faad14;--dan:#ff4d4f;
  --bg:#f5f5f5;--w:#fff;--bd:#e8e8e8;--tx:#333;--tx2:#666;--sh:0 2px 8px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font:13px/1.6 "Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
/* 侧边栏 */
.side{width:230px;background:linear-gradient(180deg,#001529,#002140);color:#fff;position:fixed;left:0;top:0;bottom:0;z-index:100;overflow-y:auto;transition:transform .3s}
.side .logo{padding:18px 14px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
.side .logo h1{font-size:17px;font-weight:600}
.side .logo span{font-size:11px;color:rgba(255,255,255,.4);display:block;margin-top:2px}
.nav-item{display:flex;align-items:center;padding:12px 20px;color:rgba(255,255,255,.65);cursor:pointer;transition:all .2s;border-left:3px solid transparent;font-size:13px;user-select:none}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-item.active{color:#fff;background:var(--pri);border-left-color:#fff}
.nav-item .ico{font-size:16px;margin-right:8px;width:18px;text-align:center}
.sub-nav{max-height:0;overflow:hidden;transition:max-height .35s;background:rgba(0,0,0,.18)}
.sub-nav.open{max-height:800px}
.sub-item{padding:10px 20px 10px 50px;color:rgba(255,255,255,.5);cursor:pointer;font-size:12px;transition:.2s}
.sub-item:hover,.sub-item.active{color:#fff;background:rgba(255,255,255,.04)}
/* 主区 */
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.head{background:var(--w);padding:0 20px;height:50px;display:flex;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:50}
.head .menu-btn{display:none;font-size:18px;cursor:pointer;margin-right:12px;color:var(--tx2)}
.head .bread{font-size:13px;color:var(--tx2)}
.head .bread b{color:var(--tx)}
.head .user{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px}
.content{flex:1;padding:16px 20px;overflow-y:auto}

/* 卡片 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.scard{background:var(--w);border-radius:8px;padding:16px;box-shadow:var(--sh);display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .15s}
.scard:hover{transform:translateY(-2px)}
.scard .si{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.scard .sinfo h4{font-size:12px;color:var(--tx2);font-weight:400}
.scard .sinfo .n{font-size:22px;font-weight:700;margin-top:2px}
.scard .sinfo .sub{font-size:11px;color:var(--tx2)}

/* 工具栏 */
.tbar{background:var(--w);border-radius:8px;padding:12px 16px;margin-bottom:12px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbar strong{font-size:14px}
.tbar .spacer{flex:1}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;transition:.2s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-p{background:var(--pri);color:#fff}.btn-p:hover{background:var(--pri-d)}
.btn-s{background:var(--suc);color:#fff}
.btn-w{background:var(--war);color:#fff}
.btn-pay{background:#722ed1;color:#fff}
.btn-pay:hover{opacity:0.85}
.btn-d{background:var(--dan);color:#fff}
.btn-o{background:var(--w);color:var(--tx);border:1px solid var(--bd)}
.btn-o:hover{border-color:var(--pri);color:var(--pri)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-xs{padding:2px 7px;font-size:11px}
input,select,textarea{padding:7px 10px;border:1px solid var(--bd);border-radius:6px;font-size:12px;outline:none;transition:border .2s;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 2px rgba(24,144,255,.15)}
select{min-width:100px}

/* 表格 */
.twrap{background:var(--w);border-radius:8px;box-shadow:var(--sh);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead{background:#fafafa}
th{padding:10px 14px;text-align:left;font-weight:500;font-size:12px;color:var(--tx2);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:9px 14px;font-size:12px;border-bottom:1px solid #f0f0f0}
.td-note{max-width:15em;word-break:break-all;overflow-wrap:break-word;white-space:normal}
tr:hover td{background:#fafafa}

/* 弹窗 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.modal{background:var(--w);border-radius:10px;box-shadow:0 6px 30px rgba(0,0,0,.18);width:760px;max-height:82vh;display:flex;flex-direction:column;animation:slideUp .25s}
.modal.wide{width:960px}
.modal-h{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.modal-h h3{font-size:15px;font-weight:600}
.modal-close{cursor:pointer;font-size:20px;color:var(--tx2);transition:.2s;line-height:1}
.modal-close:hover{color:var(--dan)}
.modal-b{padding:16px 20px;overflow-y:auto;flex:1;max-height:58vh}
.modal-f{padding:10px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.frow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
.frow.c3{grid-template-columns:repeat(3,1fr)}
.frow.c1{grid-template-columns:1fr}
.fg label{display:block;font-size:12px;color:var(--tx2);margin-bottom:3px}
.fg label .req{color:var(--dan)}
.fg input,.fg select,.fg textarea{width:100%}

/* 标签 */
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px}
.tag-blue{background:#e6f7ff;color:#1890ff}
.tag-green{background:#f6ffed;color:#52c41a}
.tag-red{background:#fff2f0;color:#ff4d4f}
.tag-orange{background:#fff7e6;color:#faad14}
.tag-gray{background:#f5f5f5;color:#999}

.alert{padding:10px 14px;border-radius:6px;margin-bottom:12px;font-size:12px}
.alert-warn{background:#fffbe6;border:1px solid #ffe58f;color:#ad6800}
.alert-info{background:#e6f7ff;border:1px solid #91d5ff;color:#096dd9}
.empty{text-align:center;padding:50px 20px;color:var(--tx2)}
.empty .ico{font-size:40px;margin-bottom:10px}
.badge-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.is-auditor .tbar .btn-p{display:none!important}
.is-supervisor .tbar .btn-p{display:inline-flex!important}
.badge-dot.danger{background:var(--dan)}
.badge-dot.warning{background:var(--war)}
.hidden{display:none!important}
@media(max-width:768px){
  .side{transform:translateX(-230px)}.side.open{transform:translateX(0)}
  .main{margin-left:0}.head .menu-btn{display:block}
  .stats{grid-template-columns:repeat(2,1fr)}.frow{grid-template-columns:1fr}
  .modal{width:95%!important}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>

<!-- 登录页（未登录时显示，默认隐藏；initApp 中若未登录才显示） -->
<div id="loginPage" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#001529,#002140);z-index:9999;flex-direction:column;align-items:center;justify-content:center">
  <div style="text-align:center;margin-bottom:40px">
    <div style="font-size:60px">📦</div>
    <h1 style="color:#fff;font-size:28px;margin:10px 0 4px">象过河仓库管理系统</h1>
    <p style="color:rgba(255,255,255,.4);font-size:13px">XiangGuoHe WMS v2.13</p>
  </div>
  <button onclick="showLogin()" style="padding:12px 60px;background:#1890ff;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer">🔑 登录系统</button>
</div>

<aside class="side" id="side" style="display:none">
  <div class="logo"><h1>📦 象过河</h1><span>仓库管理系统 v2.13.0</span></div>
  <nav id="nav"></nav>
</aside>

<div class="main" id="main" style="display:none">
  <div class="head">
    <span class="menu-btn" onclick="tgSide()">☰</span>
    <div class="bread" id="bread">📍 <b>首页仪表盘</b></div>
    <div class="user"><span id="alertBadge" class="tag tag-red hidden">0</span><span id="userDisp">👤 管理员</span> <span style="cursor:pointer;color:var(--tx2);margin-left:8px" onclick="confirmLogout()" title="退出登录">⏻</span></div>
  </div>
  <div class="content" id="pg"></div>
</div>
<div id="mc"></div>

<!-- 首屏加载骨架屏（纯 CSS，不依赖任何外部资源；系统渲染完成后自动移除） -->
<style>
#wmsBoot{position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#f5f5f5;display:flex;align-items:center;justify-content:center;flex-direction:column}
#wmsBoot .sp{width:34px;height:34px;border:3px solid #d9d9d9;border-top-color:#1890ff;border-radius:50%;animation:wmsSpin .8s linear infinite}
#wmsBoot .tx{margin-top:14px;font:13px/1.6 "Microsoft YaHei","PingFang SC",sans-serif;color:#888}
@keyframes wmsSpin{to{transform:rotate(360deg)}}
</style>
<div id="wmsBoot"><div class="sp"></div><div class="tx">正在加载系统…</div></div>
<script>
(function(){
  var removed=false;
  function hide(){
    if(removed)return;removed=true;
    var b=document.getElementById('wmsBoot');
    if(!b)return;
    b.style.transition='opacity .25s';
    b.style.opacity='0';
    setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b)},260);
  }
  window.wmsHideBoot=hide;
  var n=0;
  var t=setInterval(function(){
    n++;
    var lp=document.getElementById('loginPage');
    var pg=document.getElementById('pg')||document.getElementById('mc');
    var loginShown=lp&&lp.style.display!=='none'&&lp.style.display!=='';
    var contentReady=pg&&pg.children.length>0;
    if(loginShown||contentReady||n>80){clearInterval(t);hide();}
  },100);
})();
</script>
<script src="demo-seed.js"></script><script src="wms-core.js"></script>
<script src="ai-assistant.js"></script>
<script>
// ===== 电脑版自举 =====
(function initApp() {
  if (_wms_api_mode === 'api' && WMS_API) {
    WMS_API.init(function() {
      renderNav();
      if(initUser()){
        var main=document.getElementById('main');
        if(main) main.style.display='flex';
        var side=document.getElementById('side');
        if(side) side.style.display='block';
        var loginPage=document.getElementById('loginPage');
        if(loginPage) loginPage.style.display='none';
        setTimeout(handleQuickActions, 500);
        var savedPage = sessionStorage.getItem('wms_curPage') || 'dashboard';
        var savedTitle = sessionStorage.getItem('wms_curTitle') || '首页仪表盘';
        nav(savedPage, savedTitle);
      }
    });
  } else {
    renderNav();
    if(initUser()){
      var main=document.getElementById('main');
      if(main) main.style.display='flex';
      var side=document.getElementById('side');
      if(side) side.style.display='block';
      var loginPage=document.getElementById('loginPage');
      if(loginPage) loginPage.style.display='none';
      setTimeout(handleQuickActions, 500);
      var savedPage = sessionStorage.getItem('wms_curPage') || 'dashboard';
      var savedTitle = sessionStorage.getItem('wms_curTitle') || '首页仪表盘';
      nav(savedPage, savedTitle);
    }
  }
})();
</script>
</body>
</html>
